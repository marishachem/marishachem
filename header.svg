<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0f0c29"/>
    <stop offset="50%" style="stop-color:#302b63"/>
    <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
    <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.4"/>
    <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.4"/>
    <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
    <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#a78bfa"/>
    <stop offset="50%" style="stop-color:#22d3ee"/>
    <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="molGlow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>

<!-- Background -->
<rect width="860" height="180" fill="url(#bg)" rx="12"/>

<!-- Ambient glows -->
<ellipse cx="150" cy="90" rx="120" ry="80" fill="#7c3aed" opacity="0.12">
    <animate attributeName="cx" values="150;180;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.18;0.12" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="710" cy="90" rx="120" ry="80" fill="#06b6d4" opacity="0.12">
    <animate attributeName="cx" values="710;680;710" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.2;0.12" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="430" cy="160" rx="160" ry="60" fill="#10b981" opacity="0.08">
    <animate attributeName="ry" values="60;80;60" dur="6s" repeatCount="indefinite"/>
</ellipse>

<!-- Waves -->
<path fill="url(#wave1)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
    values="M0,140 C120,100 240,160 430,130 C620,100 740,150 860,120 L860,180 L0,180 Z;M0,120 C140,150 260,100 430,140 C600,160 720,110 860,140 L860,180 L0,180 Z;M0,140 C120,100 240,160 430,130 C620,100 740,150 860,120 L860,180 L0,180 Z"/>
</path>
<path fill="url(#wave2)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
    values="M0,155 C100,130 300,170 430,150 C560,130 750,165 860,145 L860,180 L0,180 Z;M0,145 C150,165 280,135 430,158 C580,168 700,140 860,155 L860,180 L0,180 Z;M0,155 C100,130 300,170 430,150 C560,130 750,165 860,145 L860,180 L0,180 Z"/>
</path>

<!-- ══ Organic molecules ══ -->

<!-- 1. Benzene ring (top-left): flat hexagon + inner dashed aromatic circle -->
<g filter="url(#molGlow)" opacity="0.72">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="82,44; 82,36; 82,44" dur="5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <polygon points="17,0 8.5,-14.7 -8.5,-14.7 -17,0 -8.5,14.7 8.5,14.7"
             fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 2"/>
    </g>
</g>

<!-- 2. Alkene R-CH=CH-R (top-center, subtle) -->
<g filter="url(#molGlow)" opacity="0.38">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="430,22; 430,14; 430,22" dur="7s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <line x1="-24" y1="7" x2="-8" y2="-5" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-8" y1="-5" x2="8" y2="7" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-6" y1="-8" x2="10" y2="4" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="8" y1="7" x2="24" y2="-5" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
</g>

<!-- 3. Propan-1-ol C-C-C-OH zigzag (top-right) -->
<g filter="url(#molGlow)" opacity="0.65">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="775,38; 775,30; 775,38" dur="6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <line x1="-30" y1="8" x2="-14" y2="-5" stroke="#22d3ee" stroke-width="1.5"/>
    <line x1="-14" y1="-5" x2="2" y2="8" stroke="#22d3ee" stroke-width="1.5"/>
    <line x1="2" y1="8" x2="18" y2="-5" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="19" y="-3" font-size="10" fill="#22d3ee"
          font-family="'Segoe UI', Arial, sans-serif">OH</text>
    </g>
</g>

<!-- 4. Furan: 5-membered ring with O heteroatom (bottom-left) -->
<g filter="url(#molGlow)" opacity="0.62">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="148,148; 148,140; 148,148" dur="4.5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <line x1="13.3" y1="-4.3" x2="8.2" y2="11.3" stroke="#34d399" stroke-width="1.5"/>
    <line x1="8.2" y1="11.3" x2="-8.2" y2="11.3" stroke="#34d399" stroke-width="1.5"/>
    <line x1="-8.2" y1="11.3" x2="-13.3" y2="-4.3" stroke="#34d399" stroke-width="1.5"/>
    <line x1="-13.3" y1="-4.3" x2="-5.5" y2="-11.5" stroke="#34d399" stroke-width="1.5"/>
    <line x1="5.5" y1="-11.5" x2="13.3" y2="-4.3" stroke="#34d399" stroke-width="1.5"/>
    <text x="-4.5" y="-9" font-size="11" fill="#34d399"
          font-family="'Segoe UI', Arial, sans-serif">O</text>
    </g>
</g>

<!-- 5. Glycine: H₂N-CH₂-C(=O)-OH (bottom-right) -->
<g filter="url(#molGlow)" opacity="0.58">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="710,147; 710,139; 710,147" dur="5.5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <text x="-36" y="4" font-size="10" fill="#f472b6"
          font-family="'Segoe UI', Arial, sans-serif">H&#x2082;N</text>
    <line x1="-13" y1="0" x2="0" y2="-11" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="0" y1="-11" x2="14" y2="0" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="14" y1="0" x2="14" y2="-13" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="16.5" y1="0" x2="16.5" y2="-13" stroke="#f472b6" stroke-width="1.5"/>
    <text x="11.5" y="-15" font-size="10" fill="#f472b6"
          font-family="'Segoe UI', Arial, sans-serif">O</text>
    <line x1="14" y1="0" x2="27" y2="9" stroke="#f472b6" stroke-width="1.5"/>
    <text x="28" y="13" font-size="10" fill="#f472b6"
          font-family="'Segoe UI', Arial, sans-serif">OH</text>
    </g>
</g>

<!-- ══ Protein secondary structures ══ -->

<!-- 6. Alpha helix ribbon (top area, left of center)
     Cartoon ribbon: two sinusoidal paths suggesting a coiled helical tube,
     with vertical cross-strokes at each turn for depth -->
<g filter="url(#molGlow)" opacity="0.68">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="228,32; 228,24; 228,32" dur="6.5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- Main ribbon top edge (sine wave) -->
    <path d="M-36,0 Q-27,-12 -18,0 Q-9,12 0,0 Q9,-12 18,0 Q27,12 36,0"
          fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Ribbon bottom edge (same wave offset +6) -->
    <path d="M-36,6 Q-27,-6 -18,6 Q-9,18 0,6 Q9,-6 18,6 Q27,18 36,6"
          fill="none" stroke="#fb923c" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
    <!-- Cross-strokes at each full turn to suggest ribbon width -->
    <line x1="-18" y1="0" x2="-18" y2="6" stroke="#fb923c" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#fb923c" stroke-width="1" opacity="0.5"/>
    <line x1="18" y1="0" x2="18" y2="6" stroke="#fb923c" stroke-width="1" opacity="0.5"/>
    </g>
</g>

<!-- 7. Beta strand arrow (top area, right of center)
     Cartoon broad arrow: the classic ribbon-diagram beta strand symbol -->
<g filter="url(#molGlow)" opacity="0.65">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="608,31; 608,23; 608,31" dur="5.8s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- Broad arrow body + arrowhead -->
    <path d="M-30,-5 L6,-5 L6,-12 L26,0 L6,12 L6,5 L-30,5 Z"
          fill="#60a5fa" fill-opacity="0.22" stroke="#60a5fa" stroke-width="1.5"
          stroke-linejoin="round"/>
    </g>
</g>

<!-- ══ Title text ══ -->
<text x="430" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
    font-size="36" font-weight="900" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="1">
    Hi, I'm Marina &#x1F44B;
</text>
<text x="430" y="112" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
    font-size="14" fill="#cbd5e1" letter-spacing="3" opacity="0.85">
    CHEMIST &#xB7; ML ENGINEER &#xB7; FRONTEND DEV &#xB7; QA
</text>
<line x1="280" y1="122" x2="580" y2="122" stroke="#7c3aed" stroke-width="1" opacity="0.4" stroke-dasharray="4 4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
</line>
</svg>
