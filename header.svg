<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0f0c29"/>
    <stop offset="50%" style="stop-color:#302b63"/>
    <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
    <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.4"/>
    <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.4"/>
    <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
    <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#a78bfa"/>
    <stop offset="50%" style="stop-color:#22d3ee"/>
    <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="molGlow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>

<!-- Background -->
<rect width="860" height="180" fill="url(#bg)" rx="12"/>

<!-- Ambient glows -->
<ellipse cx="150" cy="90" rx="120" ry="80" fill="#7c3aed" opacity="0.12">
    <animate attributeName="cx" values="150;180;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.18;0.12" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="710" cy="90" rx="120" ry="80" fill="#06b6d4" opacity="0.12">
    <animate attributeName="cx" values="710;680;710" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.2;0.12" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="430" cy="160" rx="160" ry="60" fill="#10b981" opacity="0.08">
    <animate attributeName="ry" values="60;80;60" dur="6s" repeatCount="indefinite"/>
</ellipse>

<!-- Waves -->
<path fill="url(#wave1)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
    values="M0,140 C120,100 240,160 430,130 C620,100 740,150 860,120 L860,180 L0,180 Z;M0,120 C140,150 260,100 430,140 C600,160 720,110 860,140 L860,180 L0,180 Z;M0,140 C120,100 240,160 430,130 C620,100 740,150 860,120 L860,180 L0,180 Z"/>
</path>
<path fill="url(#wave2)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
    values="M0,155 C100,130 300,170 430,150 C560,130 750,165 860,145 L860,180 L0,180 Z;M0,145 C150,165 280,135 430,158 C580,168 700,140 860,155 L860,180 L0,180 Z;M0,155 C100,130 300,170 430,150 C560,130 750,165 860,145 L860,180 L0,180 Z"/>
</path>

<!-- ══ Amino acid side chains + protein fragments ══ -->

<!-- 1. Phe sidechain: benzene ring + -CH₂-CH tether (top-left) -->
<g filter="url(#molGlow)" opacity="0.72">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="78,46; 78,38; 78,46" dur="5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- Benzene ring -->
    <polygon points="15,0 7.5,-13 -7.5,-13 -15,0 -7.5,13 7.5,13"
             fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- -CH₂-Cα tether from top vertex -->
    <line x1="0" y1="-13" x2="10" y2="-22" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="10" y1="-22" x2="22" y2="-14" stroke="#a78bfa" stroke-width="1.5"/>
    </g>
</g>

<!-- 2. Alpha helix ribbon (top, left of center) -->
<g filter="url(#molGlow)" opacity="0.68">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="228,33; 228,25; 228,33" dur="6.5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <path d="M-36,0 Q-27,-12 -18,0 Q-9,12 0,0 Q9,-12 18,0 Q27,12 36,0"
          fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-36,6 Q-27,-6 -18,6 Q-9,18 0,6 Q9,-6 18,6 Q27,18 36,6"
          fill="none" stroke="#fb923c" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="-18" y1="0" x2="-18" y2="6" stroke="#fb923c" stroke-width="1" opacity="0.45"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#fb923c" stroke-width="1" opacity="0.45"/>
    <line x1="18" y1="0" x2="18" y2="6" stroke="#fb923c" stroke-width="1" opacity="0.45"/>
    </g>
</g>

<!-- 3. Peptide backbone unit: HN-Cα-C(=O)-NH (top-center) -->
<g filter="url(#molGlow)" opacity="0.62">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="432,36; 432,28; 432,36" dur="7s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- HN label (N-terminus side) -->
    <text x="-34" y="4" font-size="10" fill="#fbbf24"
          font-family="'Segoe UI', Arial, sans-serif">HN</text>
    <!-- N to Cα bond -->
    <line x1="-16" y1="0" x2="-4" y2="-12" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Cα to carbonyl C -->
    <line x1="-4" y1="-12" x2="10" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- C=O (two parallel vertical lines going up) -->
    <line x1="10" y1="0" x2="10" y2="-14" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="12.5" y1="0" x2="12.5" y2="-14" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="7.5" y="-16" font-size="10" fill="#fbbf24"
          font-family="'Segoe UI', Arial, sans-serif">O</text>
    <!-- Peptide C-N bond -->
    <line x1="10" y1="0" x2="26" y2="-12" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- NH label (next residue) -->
    <text x="25" y="-14" font-size="10" fill="#fbbf24"
          font-family="'Segoe UI', Arial, sans-serif">NH</text>
    </g>
</g>

<!-- 4. Beta strand arrow (top, right of center) -->
<g filter="url(#molGlow)" opacity="0.65">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="608,32; 608,24; 608,32" dur="5.8s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <path d="M-30,-5 L6,-5 L6,-12 L26,0 L6,12 L6,5 L-30,5 Z"
          fill="#60a5fa" fill-opacity="0.22" stroke="#60a5fa" stroke-width="1.5"
          stroke-linejoin="round"/>
    </g>
</g>

<!-- 5. Imidazole (His sidechain): 5-ring with two N atoms (top-right) -->
<g filter="url(#molGlow)" opacity="0.65">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="762,40; 762,32; 762,40" dur="6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- Pentagon ring -->
    <polygon points="0,-13 12.4,-4 7.6,10.5 -7.6,10.5 -12.4,-4"
             fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- Aromatic inner circle -->
    <circle cx="0" cy="1" r="6.5" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- =N label (top vertex, pyridine-type) -->
    <text x="-4" y="-10" font-size="10" fill="#22d3ee"
          font-family="'Segoe UI', Arial, sans-serif">N</text>
    <!-- NH label (upper-left vertex, pyrrole-type) -->
    <text x="-26" y="-1" font-size="10" fill="#22d3ee"
          font-family="'Segoe UI', Arial, sans-serif">NH</text>
    </g>
</g>

<!-- 6. Indole (Trp sidechain): fused benzene+pyrrole with NH (bottom-left) -->
<g filter="url(#molGlow)" opacity="0.62">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="135,147; 135,139; 135,147" dur="4.5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- 6-ring (benzene part) with aromatic circle -->
    <polygon points="0,-6 0,6 -10,12 -21,6 -21,-6 -10,-12"
             fill="none" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="-10.5" cy="0" r="6" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- 5-ring (pyrrole part), not including shared edge C7a-C3a which is the right edge of hexagon -->
    <!-- C7a=(0,-6) → N1 → C2 → C3 → C3a=(0,6) -->
    <!-- Short bond from C7a to just before N1 -->
    <line x1="0" y1="-6" x2="8" y2="-8.5" stroke="#34d399" stroke-width="1.5"/>
    <!-- NH label at N1 position -->
    <text x="9" y="-8" font-size="9.5" fill="#34d399"
          font-family="'Segoe UI', Arial, sans-serif">NH</text>
    <!-- Bond from N1 to C2 -->
    <line x1="20" y1="-7" x2="18.5" y2="0" stroke="#34d399" stroke-width="1.5"/>
    <!-- C2 to C3 -->
    <line x1="18.5" y1="0" x2="11.5" y2="9.7" stroke="#34d399" stroke-width="1.5"/>
    <!-- C3 to C3a=(0,6) -->
    <line x1="11.5" y1="9.7" x2="0" y2="6" stroke="#34d399" stroke-width="1.5"/>
    </g>
</g>

<!-- 7. Glycine: H₂N-CH₂-C(=O)-OH (bottom-right) -->
<g filter="url(#molGlow)" opacity="0.58">
    <g>
    <animateTransform attributeName="transform" type="translate"
        values="710,147; 710,139; 710,147" dur="5.5s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <text x="-36" y="4" font-size="10" fill="#f472b6"
          font-family="'Segoe UI', Arial, sans-serif">H&#x2082;N</text>
    <line x1="-13" y1="0" x2="0" y2="-11" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="0" y1="-11" x2="14" y2="0" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="14" y1="0" x2="14" y2="-14" stroke="#f472b6" stroke-width="1.5"/>
    <line x1="16.5" y1="0" x2="16.5" y2="-14" stroke="#f472b6" stroke-width="1.5"/>
    <text x="11.5" y="-16" font-size="10" fill="#f472b6"
          font-family="'Segoe UI', Arial, sans-serif">O</text>
    <line x1="14" y1="0" x2="27" y2="9" stroke="#f472b6" stroke-width="1.5"/>
    <text x="28" y="13" font-size="10" fill="#f472b6"
          font-family="'Segoe UI', Arial, sans-serif">OH</text>
    </g>
</g>

<!-- ══ Title text ══ -->
<text x="430" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
    font-size="36" font-weight="900" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="1">
    Hi, I'm Marina &#x1F44B;
</text>
<text x="430" y="112" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
    font-size="14" fill="#cbd5e1" letter-spacing="3" opacity="0.85">
    CHEMIST &#xB7; ML ENGINEER &#xB7; FRONTEND DEV &#xB7; QA
</text>
<line x1="280" y1="122" x2="580" y2="122" stroke="#7c3aed" stroke-width="1" opacity="0.4" stroke-dasharray="4 4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
</line>
</svg>
